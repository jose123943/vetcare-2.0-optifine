# Comprueba el código y la construcción de la imagen al actualizar GitHub.
name: Verificar VetCare
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  # Revisa dependencias, configuración y sintaxis sin utilizar la base operativa.
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar y comprobar dependencias
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Validar estructura y pruebas sin base externa
        run: |
          python scripts/verificar_despliegue.py
          python -m unittest tests.test_deployment tests.test_gmail tests.test_smtp
          python scripts/build_assets.py
      - name: Comprobar sintaxis del frontend
        run: find frontend/assets/js tests/browser -type f \( -name '*.js' -o -name '*.cjs' \) -exec node --check {} \;
  # Comprueba que la imagen de producción se pueda construir antes de publicarla.
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Sólo construye: no publica imágenes ni despliega un servicio.
      - run: docker build --tag vetcare:verificacion .
